<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>明日之后 · 生存助手</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#181c22;
    --panel2:#1e232b;
    --line:#282e37;
    --ink:#e9ecf2;
    --dim:#98a1ae;
    --dim2:#6c7683;
    --cow:#e8833a;
    --sheep:#d9a441;
    --pig:#d96a8a;
    --chicken:#c9a227;
    --rabbit:#7fb069;
    --food:#2ba36a;
    --flower:#c86bb8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(232,131,58,.10), transparent 60%),
      radial-gradient(800px 500px at 88% 0%, rgba(74,168,201,.08), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 18px}

  /* ---------- header ---------- */
  header.top{
    position:sticky;top:0;z-index:50;
    background:rgba(15,17,21,.84);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid var(--line);
    padding:14px 0 12px;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--cow);box-shadow:0 0 12px var(--cow)}
  .brand h1{font-size:19px;margin:0;letter-spacing:.5px}
  .brand .ver{font-size:10.5px;font-weight:700;color:#0f1115;background:var(--cow);padding:2px 7px;border-radius:5px;letter-spacing:.5px}
  .brand .count{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:3px 9px;border-radius:99px;background:var(--panel)}
  .search{position:relative;margin-bottom:11px}
  .search input{
    width:100%;height:46px;border-radius:13px;
    background:var(--panel);border:1px solid var(--line);
    color:var(--ink);font-size:15px;padding:0 52px 0 42px;outline:none;
    font-family:inherit;transition:border-color .15s,box-shadow .15s;
  }
  .search input::placeholder{color:var(--dim2)}
  .search input:focus{border-color:#3b4654;box-shadow:0 0 0 4px rgba(255,255,255,.04)}
  .search .ico{position:absolute;left:15px;top:14px;width:18px;height:18px;opacity:.55}
  .search kbd{
    position:absolute;right:12px;top:12px;font-size:12px;color:var(--dim2);
    border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--panel2);
    font-family:inherit;pointer-events:none;
  }
  .tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:11px}
  .tabs button{
    border:0;background:transparent;color:var(--dim);font-family:inherit;
    font-size:14px;padding:7px 16px;border-radius:9px;cursor:pointer;transition:.15s;
  }
  .tabs button.on{background:var(--panel2);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips.wrap{flex-wrap:wrap;max-height:104px;overflow-y:auto;overflow-x:hidden;padding-right:4px}
  .chips.wrap::-webkit-scrollbar{width:6px}
  .chips.wrap::-webkit-scrollbar-thumb{background:#333b46;border-radius:3px}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--dim);
    font-family:inherit;font-size:13.5px;padding:7px 14px;border-radius:99px;cursor:pointer;
    transition:.15s;display:flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .chip i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
  .chip:hover{border-color:#3b4654;color:var(--ink)}
  .chip.on{background:var(--ink);color:#0f1115;border-color:var(--ink);font-weight:700}
  .chip.on i{background:#0f1115}

  /* ---------- 每日副本 ---------- */
  .daily{display:grid;grid-template-columns:minmax(320px,1.15fr) 1fr;gap:12px;margin-bottom:14px}
  .today{
    position:relative;border-radius:18px;padding:20px 22px;overflow:hidden;min-height:158px;
    background:linear-gradient(135deg, rgba(232,131,58,.18), rgba(200,107,184,.10) 58%, rgba(24,28,34,.92));
    border:1px solid rgba(232,131,58,.38);
  }
  .today::after{
    content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle,rgba(232,131,58,.38),transparent 70%);pointer-events:none;
  }
  .tlabel{font-size:13px;color:#e8c9a8;letter-spacing:.8px;display:flex;align-items:center;gap:7px;position:relative}
  .tlabel i{width:6px;height:6px;border-radius:50%;background:var(--cow);box-shadow:0 0 9px var(--cow)}
  .tname{font-size:42px;font-weight:800;letter-spacing:2px;margin:10px 0 8px;position:relative;line-height:1.1}
  .tsub{font-size:12.5px;color:#9aa3b0;position:relative}
  .upc-wrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0;overflow:hidden}
  .upc-title{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim2);margin-bottom:9px}
  .upc{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:2px}
  .upc::-webkit-scrollbar{display:none}
  .upc-item{
    flex:0 0 auto;min-width:92px;background:var(--panel2);border:1px solid var(--line);
    border-radius:11px;padding:8px 10px;cursor:pointer;transition:.15s;
  }
  .upc-item:hover{border-color:#3b4654;transform:translateY(-1px)}
  .upc-item .d{font-size:10.5px;color:var(--dim2);display:block;letter-spacing:.2px;white-space:nowrap}
  .upc-item .n{font-size:13px;font-weight:700;display:block;margin-top:3px;white-space:nowrap}
  .upc-item.next{border-color:rgba(232,131,58,.45);background:rgba(232,131,58,.09)}

    /* ---------- 联盟行动 ---------- */
  .alliance{margin-bottom:18px}
  .al-card{
    display:grid;grid-template-columns:minmax(300px,1.1fr) 1fr;gap:14px;
    background:linear-gradient(120deg, rgba(74,168,201,.14), rgba(155,135,214,.10) 55%, rgba(24,28,34,.95));
    border:1px solid rgba(74,168,201,.35);border-radius:18px;padding:18px 20px;
  }
  .al-label{font-size:12.5px;color:#a9d6e5;letter-spacing:.8px;display:flex;align-items:center;gap:7px}
  .al-label i{width:7px;height:7px;border-radius:50%;background:#4aa8c9;box-shadow:0 0 10px #4aa8c9}
  .al-name{font-size:32px;font-weight:800;letter-spacing:1.5px;margin:8px 0 6px}
  .al-meta{font-size:12px;color:var(--dim2)}
  .al-right{display:flex;flex-direction:column;justify-content:center;gap:9px;font-size:13px}
  .al-row{display:flex;gap:10px;align-items:baseline}
  .al-key{color:var(--dim2);font-size:12px;min-width:62px}
  .al-val{color:var(--ink);font-weight:600}
  .al-q{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
  .al-chip{
    font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);
    color:var(--dim);background:var(--panel2);
  }
  .al-chip.on{background:#4aa8c9;border-color:#4aa8c9;color:#0f1115;font-weight:700}
  .al-arrow{color:#3d4653;font-size:12px}
  @media (max-width:800px){
    .al-card{grid-template-columns:1fr;padding:14px 16px}
    .al-name{font-size:26px}
  }

  /* ---------- 烧纳米2 性价比 ---------- */
  .nano{margin-bottom:18px}
  .nano-card{
    background:linear-gradient(120deg, rgba(43,163,106,.13), rgba(232,131,58,.08) 60%, rgba(24,28,34,.95));
    border:1px solid rgba(43,163,106,.32);border-radius:18px;padding:16px 20px;
  }
  .nano-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .nano-head b{font-size:14px;letter-spacing:.8px;color:#8fe0b4}
  .nano-head span{font-size:11.5px;color:var(--dim2)}
  .nano-tabs{display:flex;gap:6px;margin-left:auto}
  .nano-tabs button{border:1px solid var(--line);background:var(--panel2);color:var(--dim);font-family:inherit;font-size:12px;padding:4px 12px;border-radius:8px;cursor:pointer}
  .nano-tabs button:hover{color:var(--ink)}
  .nano-tabs button.on{background:#8fe0b4;border-color:#8fe0b4;color:#0f1115;font-weight:700}
  .nano-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px}
  .nano-item{
    display:flex;flex-direction:column;gap:5px;background:rgba(255,255,255,.03);
    border:1px solid var(--line);border-radius:12px;padding:9px 12px;
  }
  .nano-top{display:flex;align-items:center;gap:9px}
  .nano-sub{font-size:11.5px;color:var(--dim2);padding-left:33px}
  .nano-sub b{color:#8fe0b4;font-weight:600}
  .nano-rank{
    width:24px;height:24px;flex:0 0 auto;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:800;color:#0f1115;background:#8fe0b4;
  }
  .nano-item:nth-child(1) .nano-rank{background:#ffd166}
  .nano-item:nth-child(2) .nano-rank{background:#cfd8e3}
  .nano-item:nth-child(3) .nano-rank{background:#e3b58f}
  .nano-name{font-size:14.5px;font-weight:700;white-space:nowrap}
  .nano-lv{margin-left:auto;font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}

  .n3-grid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.15fr);gap:14px}
  .n3-mat,.n3-cal{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .n3-t{font-size:12.5px;color:#8fe0b4;margin-bottom:9px;letter-spacing:.5px}
  .n3-row{display:flex;align-items:baseline;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
  .n3-row:last-child{border-bottom:0}
  .n3-n{font-weight:700}
  .n3-q{color:#ffd166;font-weight:700}
  .n3-s{margin-left:auto;font-size:11px;color:var(--dim2)}
  .n3-inputs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .n3-inputs label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .n3-inputs input{
    width:88px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);font-family:inherit;font-size:13px;padding:5px 8px;outline:none;
  }
  .n3-inputs input:focus{border-color:#3b4654}
  .n3-fixed{font-size:11.5px;color:var(--dim2);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
  .n3-big{font-size:15px;margin-bottom:8px}
  .n3-big b{font-size:24px;color:#8fe0b4;font-weight:800}
  .n3-line{font-size:12.5px;color:var(--dim);line-height:1.9}
  .n3-tip{margin-top:8px;font-size:11.5px;color:var(--dim2)}
  @media (max-width:820px){ .n3-grid{grid-template-columns:1fr} }

  /* ---------- 二级切换 ---------- */
  .subtabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
  .subtabs button{border:0;background:transparent;color:var(--dim);font-family:inherit;font-size:13.5px;padding:6px 14px;border-radius:9px;cursor:pointer;transition:.15s}
  .subtabs button.on{background:var(--panel2);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}

  /* ---------- filter bar ---------- */
  main.wrap{padding:30px 18px 60px}
  .filterbar{
    display:none;align-items:center;gap:10px;margin-bottom:16px;
    font-size:13.5px;color:var(--dim);background:var(--panel);border:1px solid var(--line);
    padding:9px 12px;border-radius:12px;
  }
  .filterbar.show{display:flex}
  .filterbar b{color:var(--ink)}
  .filterbar button{
    margin-left:auto;border:1px solid var(--line);background:var(--panel2);color:var(--dim);
    font-family:inherit;font-size:12.5px;padding:5px 12px;border-radius:8px;cursor:pointer;
  }
  .filterbar button:hover{color:var(--ink);border-color:#3b4654}

  /* ---------- cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px;align-items:start}
  .card{
    position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:15px;padding:13px 15px 14px 18px;cursor:pointer;
    transition:transform .12s ease,border-color .15s,background .15s;overflow:hidden;
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,#555)}
  .card:hover{border-color:#3d4653;background:var(--panel2);transform:translateY(-2px)}
  .card:active{transform:translateY(0) scale(.99)}
  .heads{display:flex;align-items:center;gap:6px;min-height:20px}
  .pill{
    display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;
    padding:3px 9px;border-radius:99px;letter-spacing:.5px;
    color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);
  }
  .copy-hint{margin-left:auto;font-size:11px;color:var(--dim2);opacity:0;transition:.15s}
  .card:hover .copy-hint{opacity:1}
  .card h3{margin:8px 0 8px;font-size:17px;letter-spacing:.3px;font-weight:700;line-height:1.25}
  .spots{display:flex;flex-direction:column;gap:4px}
  .spot{display:flex;align-items:baseline;gap:7px;font-size:13.5px;color:var(--dim);flex-wrap:wrap}
  .spot .map-link{color:var(--ink);font-weight:600;border-bottom:1px dashed #3f4854;cursor:pointer}
  .spot .map-link:hover{border-bottom-color:var(--accent);color:var(--accent)}
  .spot .sepc{color:#3d4653}
  .spot em{font-style:normal;font-size:11.5px;color:var(--dim2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}

  /* ---------- map view ---------- */
  .maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
  .mapcard{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px 15px}
  .mapcard header{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
  .mapcard header h3{margin:0;font-size:16.5px;cursor:pointer}
  .mapcard header h3:hover{color:var(--cow)}
  .mapcard header em{font-style:normal;font-size:11.5px;color:var(--dim);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
  .mapcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
  .mapcard li{
    display:flex;align-items:center;gap:9px;font-size:13.5px;padding:6px 8px;border-radius:9px;
    cursor:pointer;transition:.12s;
  }
  .mapcard li:hover{background:var(--panel2)}
  .mapcard li i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .mapcard li b{font-weight:600;display:flex;align-items:center;gap:6px}
  .mapcard li span{color:var(--dim);margin-left:auto;font-size:12.5px;text-align:right}

  .empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:60px 20px;border:1px dashed var(--line);border-radius:16px;font-size:14px;line-height:2}

  /* ---------- 食物图鉴 ---------- */
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
  .fcard{
    background:var(--panel);border:1px solid var(--line);border-radius:15px;
    padding:13px 15px;cursor:pointer;transition:transform .12s,border-color .15s,background .15s;
  }
  .fcard:hover{border-color:#3d4653;background:var(--panel2);transform:translateY(-2px)}
  .fcard:active{transform:none}
  .fhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .fhead h3{margin:0;font-size:16px;font-weight:700;letter-spacing:.3px}
  .fc{
    font-size:11px;color:var(--cow);border:1px solid rgba(232,131,58,.35);border-radius:99px;
    padding:1px 8px;margin-left:auto;white-space:nowrap;background:rgba(232,131,58,.08);
  }
  .fmat{font-size:12.5px;color:var(--dim);line-height:1.6;margin-bottom:9px}
  .fmat b{color:var(--ink);font-weight:600;margin-right:6px;font-size:11.5px}
  .feffs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
  .feffs li{
    font-size:11.5px;line-height:1.5;color:#9fe0bd;background:rgba(43,163,106,.13);
    border:1px solid rgba(43,163,106,.26);border-radius:7px;padding:2px 7px;
  }
  .fnote{font-size:11.5px;color:#c9a227;margin-top:8px}
  .fdur{font-size:11px;color:var(--dim2);margin-top:6px}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:var(--ink);color:#0f1115;font-size:13.5px;font-weight:700;
    padding:11px 20px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:.22s;z-index:99;max-width:86vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  .foot{max-width:1120px;margin:0 auto;padding:0 18px 40px;color:var(--dim2);font-size:12.5px;line-height:2}
  .foot b{color:var(--dim)}
  @media (max-width:560px){
    .brand h1{font-size:17px}
    .grid{grid-template-columns:1fr 1fr;gap:10px}
    .card{padding:12px 12px 12px 15px;border-radius:13px}
    .card h3{font-size:15px}
    .spot{font-size:12.5px}
    .mapcard{padding:12px}
  }
  @media (max-width:800px){
    .daily{grid-template-columns:1fr}
    .tname{font-size:24px}
  }
  @media (max-width:560px){
    .upc-title span:last-child{display:none}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="dot"></span>
      <h1>明日之后 · 生存助手</h1>
      <span class="ver">新版</span>
      <span class="count" id="count">—</span>
    </div>
    <div class="search">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#98a1ae" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.2-4.2"></path>
      </svg>
      <input id="q" type="search" placeholder="搜品种 / 地图 / 地点，例：绒绒、红杉镇、老牧场" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <div class="tabs" id="tabs">
      <button data-view="dungeon" class="on">副本</button>
      <button data-view="nano">纳米</button>
      <button data-view="farm">养殖</button>
      <button data-view="food">食物图鉴</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="chips" id="chips2" style="display:none;margin-top:8px"></div>
  </div>
</header>

<main class="wrap">
  <section class="daily">
    <div class="today" id="dailyToday"></div>
    <div class="upc-wrap">
      <div class="upc-title"><span>接下来 7 天</span><span>点一下看日期</span></div>
      <div class="upc" id="dailyUpc"></div>
    </div>
  </section>
  <section class="alliance" id="allianceBand"></section>
  <section class="nano" id="nanoBand"></section>
  <div class="subtabs" id="farmTabs" style="display:none">
    <button data-fv="animal" class="on">按品种</button>
    <button data-fv="map">按地图</button>
  </div>
  <div class="filterbar" id="filterbar">
    <span>正在只看 <b id="fb-map"></b></span>
    <button id="fb-clear">清除 ✕</button>
  </div>
  <section class="grid" id="animalView"></section>
  <section class="maps" id="mapView" style="display:none"></section>
  <section class="fgrid" id="foodView" style="display:none"></section>
</main>

<div class="foot wrap">
  页签：<b>副本</b>（今日副本 + 联盟行动）｜<b>纳米</b>（纳米1/2 性价比 · 纳米3 珊瑚绒材料测算）｜<b>养殖</b>（动物 + 鲜花）｜<b>食物图鉴</b>（511 道）<br>
  点卡片 = 复制内容｜点地图名 = 只看这张图｜按 <b>/</b> 搜索、<b>Esc</b> 清空
</div>

<div class="toast" id="toast"></div>

<script>

/* ================= 联盟行动 ================= */
// 每周 1 次，每 4 周轮换一次，周日 03:00 刷新
// 2026-11-22（周日）03:00 起 = 遗迹岛屿 第 1 轮第 1 周
const ALLIANCE = ["遗迹岛屿","荒寂戈壁","祸起蛛巢"];
const AL_ANCHOR = new Date(2026, 10, 22, 3, 0, 0);
const WEEKMS = 7 * 86400000;

const pad2 = n => String(n).padStart(2, "0");
const fmtDT = d => `${d.getMonth()+1}月${d.getDate()}日 ${WD[d.getDay()]} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
function human(ms){
  if (ms < 0) ms = 0;
  const d = Math.floor(ms / 86400000);
  const h = Math.floor(ms % 86400000 / 3600000);
  const m = Math.floor(ms % 3600000 / 60000);
  if (d > 0) return `${d} 天 ${h} 小时`;
  if (h > 0) return `${h} 小时 ${m} 分`;
  return `${m} 分钟`;
}
function allianceInfo(now){
  now = now || new Date();
  const weeks = Math.floor((now - AL_ANCHOR) / WEEKMS);
  const idx = (((Math.floor(weeks / 4)) % 3) + 3) % 3;
  const weekIn = ((weeks % 4) + 4) % 4 + 1;
  const weekStart = new Date(AL_ANCHOR.getTime() + weeks * WEEKMS);
  const nextReset = new Date(weekStart.getTime() + WEEKMS);
  const cycleStartWeek = Math.floor(weeks / 4) * 4;
  const nextRotate = new Date(AL_ANCHOR.getTime() + (cycleStartWeek + 4) * WEEKMS);
  return { idx, weekIn, nextReset, nextRotate, name: ALLIANCE[idx] };
}
function renderAlliance(){
  const now = new Date();
  const a = allianceInfo(now);
  const chips = ALLIANCE.map((n,i)=>`<span class="al-chip ${i===a.idx?"on":""}">${n}</span>`).join('<span class="al-arrow">→</span>');
  $("#allianceBand").innerHTML = `
    <div class="al-card">
      <div>
        <div class="al-label"><i></i>联盟行动 · 本周</div>
        <div class="al-name">${a.name}</div>
        <div class="al-meta">每周 1 次 · 每 4 周轮换 · 周日 03:00 刷新</div>
      </div>
      <div class="al-right">
        <div class="al-row"><span class="al-key">本轮进度</span><span class="al-val">第 ${a.weekIn} / 4 周</span></div>
        <div class="al-row"><span class="al-key">下次刷新</span><span class="al-val">${fmtDT(a.nextReset)} · 还有 ${human(a.nextReset - now)}</span></div>
        <div class="al-row"><span class="al-key">下次轮换</span><span class="al-val">${fmtDT(a.nextRotate)} 换成 ${ALLIANCE[(a.idx+1)%3]}</span></div>
        <div class="al-q">${chips}</div>
      </div>
    </div>`;
}

function renderNano3(){

      <div class="n3-grid">
        <div class="n3-mat">
          <div class="n3-t">制作配方（1 份 ${m.name}）</div>
          ${m.mats.map(x=>`<div class="n3-row"><span class="n3-n">${x.n}</span><span class="n3-q">×${x.qty}</span><span class="n3-s">${x.src}</span></div>`).join("")}
        </div>

        <div class="n3-cal">
          <div class="n3-t">按剩余额度算能做多少</div>
          <div class="n3-inputs">
            <label>剩余额度
              <input id="n3quota" type="number" min="0" step="1" value="200" inputmode="numeric">
            </label>
            <span class="n3-fixed">1 额度 = 1 材料</span>
          </div>
          <div id="n3out" class="n3-out"></div>
        </div>
      </div>
    </div>`;

  const calc = ()=>{
    const q = Math.max(0, Math.floor(parseFloat($("#n3quota").value) || 0));
    const max = perCraft > 0 ? Math.floor(q / perCraft) : 0;
    const used = max * perCraft;
    const left = q - used;
    const need = ex.map(x=>`${x.n} ${x.qty * max}`).join("　");
    const dneed = dungeon.map(x=>`${x.n} ${x.qty * max}`).join("　");

  };
  $("#n3quota").addEventListener("input", calc);
  calc();

  document.querySelectorAll("#nanoBand .nano-tabs button").forEach(b=>{
    b.onclick = ()=>{ state.nanoSel = +b.dataset.nano; renderNano(); };
  });
}

/* ================= 工具 ================= */
function toast(msg){
  elToast.textContent = msg;
  elToast.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>elToast.classList.remove("on"), 1500);
}
function copy(text){
  const done = ()=>toast("已复制：" + text);
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else fallback(text, done);
}
function fallback(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast(text); }
  document.body.removeChild(ta);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= 每日副本 ================= */
// 8 个副本按顺序每天轮换；2026-11-25 = 黑珍珠城堡（循环第 1 个）
const DUNGEONS = ["黑珍珠城堡","海岛暗礁","山脚据点","秋日秘径","黄沙戈壁","黑泥沼","高地工厂","迷境诡林"];
const DUNGEON_ANCHOR = new Date(2026, 10, 25); // 本地时间 2026-11-25 00:00
const WD = ["周日","周一","周二","周三","周四","周五","周六"];

const elDailyToday = $("#dailyToday"), elDailyUpc = $("#dailyUpc");
const ymd = d => `${d.getMonth()+1}月${d.getDate()}日`;
const md  = d => `${d.getMonth()+1}/${d.getDate()}`;

function renderDaily(){
  const now = new Date();
  const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((d0 - DUNGEON_ANCHOR) / 86400000);
  const idx = ((diff % 8) + 8) % 8;

  elDailyToday.innerHTML = `
    <div class="tlabel"><i></i>今日副本 · ${ymd(d0)} ${WD[d0.getDay()]}</div>
    <div class="tname">${DUNGEONS[idx]}</div>
    <div class="tsub">8 个副本每天固定轮换 · 今天是循环第 ${idx+1} 个</div>`;

  let html = "";
  for (let k = 1; k <= 7; k++){
    const dd = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + k);
    const name = DUNGEONS[(idx + k) % 8];
    html += `<div class="upc-item ${k === 1 ? "next" : ""}" data-d="${ymd(dd)} ${WD[dd.getDay()]}" data-n="${name}">
      <span class="d">${k === 1 ? "明天 " : ""}${md(dd)} ${WD[dd.getDay()]}</span>
      <span class="n">${name}</span>
    </div>`;
  }
  elDailyUpc.innerHTML = html;
  elDailyUpc.querySelectorAll(".upc-item").forEach(x=>{
    x.onclick = ()=> toast(`${x.dataset.n} · ${x.dataset.d}`);
  });
}

/* ================= 取数 ================= */
// 全部 = 动物 + 鲜花；食物要单独点「食物」才进来（避免刷屏）
function pool(){
  if (state.type === "食物") return ANIMALS.concat(FLOWERS, FOODS);
  return ANIMALS.concat(FLOWERS);
}
function hitKeyword(it){
  if (!state.q) return true;
  const k = state.q.trim().toLowerCase();
  if (!k) return true;
  const hay = it.n + " " + it.t + " " + it.spots.map(s=>s.m + " " + (s.p||"")).join(" ");
  return hay.toLowerCase().includes(k);
}
function hit(it){
  if (state.type !== "全部" && it.t !== state.type) return false;
  if (state.map && !it.spots.some(s=>s.m === state.map)) return false;
  return hitKeyword(it);
}
function copyText(it){
  const parts = it.spots.map(s => s.m + (s.p ? "·" + s.p : ""));
  return `${it.n} ${parts.join(" / ")}`;
}

/* ================= 渲染 ================= */
function renderChips(){
  const base = pool().filter(it=>{
    if (state.map && !it.spots.some(s=>s.m === state.map)) return false;
    return hitKeyword(it);
  });
  const counts = {}; base.forEach(it=> counts[it.t] = (counts[it.t]||0)+1);
  const totalAll = base.filter(it=>it.t!=="食物").length;
  const foodAll  = ANIMALS.concat(FLOWERS, FOODS).filter(hitKeyword).filter(it=>it.t==="食物").length;
  const shownFood = state.type === "食物";

  let html = `<button class="chip ${state.type==="全部"?"on":""}" data-type="全部">全部 <span style="opacity:.6">${totalAll}</span></button>`;
  TYPES.forEach(x=>{
    if (x.t === "食物"){
      const n = foodAll;
      html += `<button class="chip ${shownFood?"on":""}" data-type="食物" style="color:${shownFood?"#0f1115":x.color}">
        <i></i>食物 <span style="opacity:.6">${n}</span></button>`;
      return;
    }
    const n = counts[x.t]||0;
    html += `<button class="chip ${state.type===x.t?"on":""}" data-type="${x.t}" style="color:${state.type===x.t?"#0f1115":x.color}">
      <i></i>${x.t} <span style="opacity:.6">${n}</span></button>`;
  });
  elChips.innerHTML = html;
  elChips.querySelectorAll(".chip").forEach(btn=>{
    btn.onclick = ()=>{ state.type = btn.dataset.type; render(); };
  });
}

function renderCountText(t){
  elCount.textContent = (t === "今日") ? "今日刷新" : `共 ${t} 条`;
}
function renderCount(n){ elCount.textContent = `共 ${n} 条`; }

function spotHTML(s, accent){
  const map = `<b class="map-link" data-map="${esc(s.m)}">${esc(s.m)}</b>`;
  if (s.p) return `<div class="spot">${map}<span class="sepc">·</span><span>${esc(s.p)}</span></div>`;
  return `<div class="spot">${map}<em>全图刷新</em></div>`;
}
// 一行装下所有刷新点
function spotsBlock(it){
  return it.spots.map(s=>spotHTML(s)).join("");
}

function renderAnimalView(){
  const list = pool().filter(hit);
  renderCount(list.length);
  if (!list.length){
    elAnimal.innerHTML = `<div class="empty">没搜到东西<br><span style="font-size:13px">换个词试试：绒绒、红杉镇、老牧场</span></div>`;
    return;
  }
  list.sort((a,b)=>{
    return ORDER.indexOf(a.t) - ORDER.indexOf(b.t)
        || a.n.localeCompare(b.n, "zh");
  });
  elAnimal.innerHTML = list.map((it,i)=>{
    const color = COLOR[it.t];
    return `<article class="card" style="--accent:${color}" data-i="${i}">
      <div class="heads">
        <span class="pill">${it.t}</span>
        <span class="copy-hint">点击复制</span>
      </div>
      <h3>${esc(it.n)}</h3>
      <div class="spots">${spotsBlock(it)}</div>
    </article>`;
  }).join("");

  elAnimal.querySelectorAll(".card").forEach(card=>{
    card.onclick = ()=>{
      const it = list[+card.dataset.i];
      copy(copyText(it));
    };
  });
  elAnimal.querySelectorAll(".map-link").forEach(b=>{
    b.onclick = e=>{ e.stopPropagation(); state.map = b.dataset.map; state.view="farm"; state.farmView="animal"; render(); };
  });
}

function renderMapView(){
  const list = pool().filter(hit);
  renderCount(list.length);

  const byMap = {};
  list.forEach(it=>{
    it.spots.forEach(s=>{
      if (state.map && s.m !== state.map) return;
      (byMap[s.m] = byMap[s.m] || []).push({it, p:s.p});
    });
  });
  let maps = Object.keys(byMap).sort((a,b)=> byMap[b].length - byMap[a].length || a.localeCompare(b,"zh"));
  if (!maps.length){
    elMap.innerHTML = `<div class="empty">没搜到东西<br><span style="font-size:13px">换个词试试：绒绒、红杉镇、老牧场</span></div>`;
    return;
  }
  elMap.innerHTML = maps.map(m=>{
    const rows = byMap[m].slice().sort((a,b)=>{
      return ORDER.indexOf(a.it.t) - ORDER.indexOf(b.it.t)
          || a.it.n.localeCompare(b.it.n,"zh");
    });
    const na = rows.filter(r=>r.it.t!=="食物" && r.it.t!=="鲜花").length;
    const nf = rows.filter(r=>r.it.t==="鲜花").length;
    const ng = rows.filter(r=>r.it.t==="食物").length;
    const tag = [na?na+"只":null, nf?nf+"花":null, ng?ng+"食":null].filter(Boolean).join(" · ");
    return `<article class="mapcard">
      <header>
        <h3 data-map="${esc(m)}">${esc(m)}</h3>
        <em>${tag}</em>
      </header>
      <ul>${rows.map(r=>`
        <li data-m="${esc(m)}" data-t="${r.it.t}" data-n="${esc(r.it.n)}" data-p="${esc(r.p||"")}">
          <i style="background:${COLOR[r.it.t]}"></i>
          <b>${esc(r.it.n)}</b>
          <span>${r.p ? esc(r.p) : "全图"}</span>
        </li>`).join("")}
      </ul>
    </article>`;
  }).join("");

  elMap.querySelectorAll("li").forEach(li=>{
    li.onclick = ()=>{
      const m = li.dataset.m, n = li.dataset.n, p = li.dataset.p;
      copy(`${n} ${m}${p ? "·" + p : ""}`);
    };
  });
  elMap.querySelectorAll("header h3").forEach(h=>{
    h.onclick = ()=>{ state.map = h.dataset.map; state.view = "farm"; state.farmView = "animal"; render(); };
  });
}

/* ---------- 食物图鉴 ---------- */
function tagsOf(it){
  const s = it.e.join(" ");
  const out = [];
  const add = t => { if (!out.includes(t)) out.push(t); };
  if (/移动速度/.test(s)) add("移速");
  if (/感染者伤害|污染|感染生物/.test(s)) add("感染者伤害");
  if (/人型/.test(s)) add("人型怪伤害");
  if (/野生|动物伤害/.test(s)) add("野生动物伤害");
  if (/建筑/.test(s)) add("建筑伤害");
  if (/头部|命中|爆头/.test(s)) add("头部伤害");
  if (/射速/.test(s)) add("射速");
  if (/射程/.test(s)) add("射程");
  if (/暴击率/.test(s)) add("暴击率");
  if (/换弹/.test(s)) add("换弹");
  if (/弹匣|弹药|携弹|补弹/.test(s)) add("弹药");
  if (/稳定/.test(s)) add("稳定");
  if (/回复血量|恢复血量|回血/.test(s)) add("回血");
  if (/饱食/.test(s)) add("饱食度");
  if (/血量上限|生命值上限/.test(s)) add("血量上限");
  if (/气力上限|最大气息/.test(s)) add("气力上限");
  if (/恢复气力/.test(s)) add("回气力");
  if (/体温提升/.test(s)) add("保暖");
  if (/体温降低/.test(s)) add("降温");
  if (/感冒/.test(s)) add("免疫感冒");
  if (/沙尘/.test(s)) add("抗沙尘");
  if (/沼泽/.test(s)) add("抗沼泽");
  if (/雪抵抗|寒冰/.test(s)) add("抗寒");
  if (/雷电|雷雨/.test(s)) add("抗雷");
  if (/风暴|暴风雪/.test(s)) add("抗风暴");
  if (/采集速度/.test(s)) add("采集速度");
  if (/采集熟练度/.test(s)) add("采集熟练度");
  if (/木\/矿\/麻[^，]{0,4}速度/.test(s)) { add("伐木速度"); add("挖矿速度"); add("采麻速度"); }
  if (/木\/矿\/麻主资源暴击/.test(s)) { add("伐木暴击"); add("挖矿暴击"); add("采麻暴击"); }
  if (/木\/矿\/麻副资源暴击/.test(s)) { add("伐木暴击"); add("挖矿暴击"); add("采麻暴击"); }
  if (/伐木速度/.test(s)) add("伐木速度");
  if (/挖矿速度/.test(s)) add("挖矿速度");
  if (/采麻速度/.test(s)) add("采麻速度");
  if (/伐木主|伐木副/.test(s)) add("伐木暴击");
  if (/挖矿主|挖矿副/.test(s)) add("挖矿暴击");
  if (/采麻主|采麻副/.test(s)) add("采麻暴击");
  if (/战斗熟练度/.test(s)) add("战斗熟练度");
  if (/游泳/.test(s)) add("游泳");
  if (/奔跑/.test(s)) add("奔跑消耗");
  if (/跳跃/.test(s)) add("跳跃");
  if (/免暴/.test(s)) add("免暴");
  if (/挥砍/.test(s)) add("挥砍速度");
  if (/攻击力/.test(s)) add("攻击力");
  if (/护甲/.test(s)) add("护甲值");
  if (/弹跳/.test(s)) add("弹跳");
  if (/精力值/.test(s)) add("精力值");
  if (/稳定性/.test(s)) add("稳定性");
  if (/孢子|共生|再生/.test(s)) add("再生/孢子");
  return out;
}
FOODS_ALL.forEach(it => { it.tags = tagsOf(it); });
const TAG_INDEX = {};
FOODS_ALL.forEach(it => it.tags.forEach(t => { TAG_INDEX[t] = (TAG_INDEX[t]||0) + 1; }));

function foodKeywordOk(it){
  if (!state.q) return true;
  const k = state.q.trim().toLowerCase();
  if (!k) return true;
  return (it.n + it.i + it.e.join("") + it.tags.join("") + (it.note||"")).toLowerCase().includes(k);
}
function foodHit(it){
  if (!foodKeywordOk(it)) return false;
  for (const t of state.tags){
    if (!it.tags.includes(t)) return false;
  }
  return true;
}

function renderFoodChips(){
  if (!FOODS_ALL.length){ elChips.innerHTML = ""; return; }
  // 标签按数量排序，多选是「同时具备」
  const pool = FOODS_ALL.filter(foodKeywordOk);
  const cnt = {};
  pool.forEach(it => it.tags.forEach(t => { cnt[t] = (cnt[t]||0)+1; }));
  const tags = Object.keys(cnt).sort((a,b)=> cnt[b]-cnt[a] || a.localeCompare(b,"zh"));

  let html = "";
  if (state.tags.length){
    html += `<button class="chip" id="fclear" style="color:#ff8a65;border-color:rgba(255,138,101,.45)">清空 ${state.tags.length} 项 ✕</button>`;
  }
  html += tags.map(t=>{
    const on = state.tags.includes(t);
    return `<button class="chip ${on?"on":""}" data-tag="${t}">${t} <span style="opacity:.6">${cnt[t]}</span></button>`;
  }).join("");
  elChips.innerHTML = html;
  elChips.querySelectorAll(".chip").forEach(b=>{
    b.onclick = ()=>{
      if (b.id === "fclear"){ state.tags = []; render(); return; }
      const t = b.dataset.tag;
      const k = state.tags.indexOf(t);
      if (k >= 0) state.tags.splice(k,1); else state.tags.push(t);
      render();
    };
  });
}

function renderFoodView(){
  if (!FOODS_ALL.length){
    elCount.textContent = "待录入";
    elFood.innerHTML = `<div class="empty">食物库已清空，等你发图<br><span style="font-size:13px">一张表一张表来：你发图 → 我逐条核对 → 确认没问题再写进这里</span></div>`;
    return;
  }
  const list = FOODS_ALL.filter(foodHit);
  const cond = state.tags.length ? `（同时具备 ${state.tags.join(" + ")}）` : "";
  elCount.textContent = `共 ${list.length} 道${cond}`;
  if (!list.length){
    elFood.innerHTML = `<div class="empty">没有同时满足的组合<br><span style="font-size:13px">少选一个加成再试，比如只留「移速」</span></div>`;
    return;
  }
  list.sort((a,b)=> a.n.localeCompare(b.n, "zh"));
  elFood.innerHTML = list.map((it,i)=>`
    <article class="fcard" data-i="${i}">
      <div class="fhead"><h3>${esc(it.n)}</h3></div>
      <div class="fmat"><b>配方</b>${esc(it.i.split("+").join(" + "))}</div>
      <ul class="feffs">${it.e.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>
      ${it.note ? `<div class="fnote">获取：${esc(it.note)}</div>` : ""}
      ${it.d ? `<div class="fdur">持续时间 ${esc(it.d)}</div>` : ""}
    </article>`).join("");
  elFood.querySelectorAll(".fcard").forEach(card=>{
    card.onclick = ()=>{
      const it = list[+card.dataset.i];
      copy(`${it.n}｜${it.i.split("+").join("+")}｜${it.e.join("，")}`);
    };
  });
}

function render(){
  const v = state.view;
  const isDungeon = v === "dungeon", isNano = v === "nano", isFarm = v === "farm", isFood = v === "food";

  $$("#tabs button").forEach(b=> b.classList.toggle("on", b.dataset.view === v));

  // 区块显隐
  document.querySelector(".daily").style.display = isDungeon ? "grid" : "none";
  document.querySelector(".alliance").style.display = isDungeon ? "block" : "none";
  document.querySelector(".nano").style.display = isNano ? "block" : "none";
  $("#farmTabs").style.display = isFarm ? "inline-flex" : "none";
  // 副本 / 纳米页没有可搜内容，隐藏搜索框
  $("#q").closest(".search").style.display = (isDungeon || isNano) ? "none" : "block";

  elAnimal.style.display = (isFarm && state.farmView === "animal") ? "grid" : "none";
  elMap.style.display    = (isFarm && state.farmView === "map") ? "grid" : "none";
  elFood.style.display   = isFood ? "grid" : "none";

  // 标签条：养殖看品种，食物看加成，副本/纳米不需要
  const showChips = isFarm || isFood;
  elChips.style.display = showChips ? "flex" : "none";
  elChips2.style.display = "none";
  elChips.classList.toggle("wrap", isFood);
  $("#q").placeholder = isFood
    ? "搜菜名 / 材料 / 效果，例：面粉、移速、暴击"
    : "搜品种 / 地图 / 地点，例：绒绒、红杉镇、老牧场";

  if (isDungeon){
    renderCountText("今日");
    renderDaily(); renderAlliance();
    elFB.classList.remove("show");
    return;
  }
  if (isNano){
    renderNano();
    elFB.classList.remove("show");
    return;
  }
  if (isFood){
    elFB.classList.remove("show");
    renderFoodChips();
    renderFoodView();
    return;
  }

  // 养殖
  if (state.map){ elFB.classList.add("show"); elFBMap.textContent = state.map; }
  else elFB.classList.remove("show");

  renderChips();
  if (state.farmView === "animal") renderAnimalView();
  else renderMapView();
}

/* ================= 事件 ================= */
function fromHash(){
  const h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if (!h) return;
  if (h === "map"){ state.view = "farm"; state.farmView = "map"; }
  else if (h === "food") state.view = "food";
  else if (h === "dungeon" || h === "nano" || h === "farm") state.view = h;
  else if (TYPES.some(x => x.t === h)) state.type = h;
}
$("#q").addEventListener("input", e=>{ state.q = e.target.value; render(); });
$("#tabs").addEventListener("click", e=>{
  const b = e.target.closest("button");
  if (!b) return;
  state.view = b.dataset.view;
  if (state.view === "farm") state.farmView = state.farmView || "animal";
  render();
});
elFBClear.onclick = ()=>{ state.map = null; render(); };
$("#farmTabs").addEventListener("click", e=>{
  const b = e.target.closest("button");
  if (!b) return;
  state.farmView = b.dataset.fv;
  $$("#farmTabs button").forEach(x=> x.classList.toggle("on", x.dataset.fv === state.farmView));
  render();
});
document.addEventListener("keydown", e=>{
  if (e.key === "/" && document.activeElement.tagName !== "INPUT"){
    e.preventDefault(); $("#q").focus();
  }
  if (e.key === "Escape" && document.activeElement === $("#q")){
    $("#q").value = ""; state.q = ""; $("#q").blur(); render();
  }
});

fromHash();
renderDaily();
renderAlliance();
renderNano();
render();

// 跨天自动换副本、每分钟刷新联盟行动倒计时
let _dayKey = new Date().toDateString();
setInterval(()=>{
  const k = new Date().toDateString();
  if (k !== _dayKey){
    _dayKey = k;
    renderDaily();
    renderAlliance();
  } else if (state.view === "dungeon"){
    renderAlliance();
  }
}, 60000);
</script>
